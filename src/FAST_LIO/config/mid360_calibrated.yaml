/**:
    ros__parameters:
        # 核心：开启特征提取（加环境约束，抗漂关键）
        feature_extract_enable: true  
        # 保留全量点云（保证特征数量，不丢点）
        point_filter_num: 1            
        max_iteration: 5               # 增加迭代次数，提升位姿优化精度
        # 微调滤波核：兼顾特征保留和抗噪
        filter_size_surf: 0.4          
        filter_size_map: 0.4
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"  
            imu_topic:  "/livox/imu"    
            time_sync_en: false         
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1               
            scan_line:  4             
            blind: 0.25                   
            timestamp_unit: 3            
            scan_rate: 10                

        mapping:
            acc_cov: 0.1      
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0         
            det_range:     80.0          
            # 开启在线外参估计（适配安装偏差，减少系统误差）
            extrinsic_est_en:  true      
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true                
            effect_map_en: false         
            map_en: true                 
            scan_publish_en:  true       
            dense_publish_en: true      
            scan_bodyframe_pub_en: true  

        pcd_save:
            pcd_save_en: true            
            interval: 1
